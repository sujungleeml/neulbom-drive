name: Android CI

on:
  push:
    branches: [main, "contest/**"]
  pull_request:

jobs:
  domain-tests:
    name: Domain tests (pure Kotlin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests without Android SDK
        run: ./gradlew -Pneulbom.jvmOnly=true test --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: domain-test-reports
          path: "**/build/reports/tests/"

  android:
    name: Android build, Robolectric tests, mock APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit + Robolectric tests
        run: ./gradlew test --stacktrace
      - name: Assemble mock and pleos APKs
        run: ./gradlew assembleMockDebug assemblePleosDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: neulbom-drive-mock-debug-apk
          path: app/build/outputs/apk/mock/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: car-screens
          path: app/build/car-screens/*.png
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-reports
          path: "**/build/reports/tests/"
